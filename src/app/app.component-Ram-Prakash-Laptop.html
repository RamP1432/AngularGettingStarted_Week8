<div>
  <h1>{{ title }}</h1>
  <h2>{{ message }}</h2>

  <!-- ✅ Input field with two-way binding using ngModel -->
  <input type="text" [(ngModel)]="userName" placeholder="Enter your name">

  <!-- ✅ Display user name dynamically -->
  <h2>Hello {{ userName }} from BridgeLabz</h2>

  <!-- ✅ Fix background image -->
  <div 
  [style.backgroundImage]="'url(' + logoUrl + ')'"
  style="width: 100%; height: 100%; background-size: cover; background-position: center;"
  (click)="onClick($event)">
</div>


<!-- ✅ Add Router Outlet -->
<router-outlet></router-outlet>
